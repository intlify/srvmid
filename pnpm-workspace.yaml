packages:
  - packages/*

allowBuilds:
  esbuild: true

catalog:
  "@intlify/utils": ^1.0.1
  "@intlify/core": ^11.4.4
  "@types/node": ^26.0.0
  publint: ^0.3.21
  typedoc: ^0.28.19
  typedoc-plugin-markdown: ^4.11.0
  typescript: ^6.0.3
  srvx: ^1.0.0
  h3: 2.0.8
  nitro: 3.0.260311-beta
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - "@intlify/*"

onlyBuiltDependencies:
  - deno
  - esbuild
  - sharp
  - unrs-resolver
  - workerd
  - "@oxfmt/*"
  - oxfmt
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
