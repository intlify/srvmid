- name: ❗ p4-important
  description: 'Priority 4: bugs that violate documented behavior, or significantly impact perf'
  color: '#d93f0b'
- name: 🔥 p5-urgent
  description: 'Priority 5: build-breaking bugs that affect most users and should be fixed ASAP'
  color: '#ee0701'
